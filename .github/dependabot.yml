# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
registries:
  maven-google:
    type: maven-repository
    # url: https://maven.google.com
    url: https://dl.google.com/dl/android/maven2/
    password: dummy
    username: dummy
  maven-central:
    type: maven-repository
    url: https://repo1.maven.org/maven2/
    password: dummy
    username: dummy
  maven-jitpack:
    type: maven-repository
    url: https://jitpack.io
    password: dummy
    username: dummy

updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: "weekly"
    registries: "*"
    open-pull-requests-limit: 20
    groups:
      kotlin_KSP:
        patterns:
          - "org.jetbrains.kotlin:*"
          - "com.google.devtools.ksp"
    ignore:
      - dependency-name: "com.google.protobuf:protobuf-javalite"
        # 4.27+ 包含 well-known-types，与 firebase 的 protolite-well-known-types 冲突
      - dependency-name: "org.mozilla:rhino"
        # 1.9.0+ 移除了 VMBridge 并修改了核心 API 签名，且书源 JS 引擎属于高风险平台能力
      - dependency-name: "org.jsoup:jsoup"
        # 1.16.2 以上行为变动破坏 AnalyzeByJSoup 与 JsoupXpath
      - dependency-name: "cn.hutool:hutool-crypto"
        # 版本固定 5.8.22 供书源 JS 使用，勿升级
      - dependency-name: "com.squareup.okhttp3:okhttp"
        # 5.5.0 破坏 Cronet 适配层的 HttpMethod 内部 API
      - dependency-name: "com.github.jenly1314:zxing-lite"
        # 3.5.0 DecodeConfig API 不兼容
      - dependency-name: "org.jetbrains.kotlinx:kotlinx-datetime"
        # 0.8.0 破坏 Clock.System API
      - dependency-name: "androidx.compose.material3:material3"
        # alpha27 存在 ExposedDropdownMenu 等 API 破坏性变动
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: npm
    directory: "modules/web"
    schedule:
      interval: "weekly"
